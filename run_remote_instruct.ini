

远程运行方法：

1.第一步：在 Ubuntu 上正常启动 FastAPI 后端
在你的云服务器终端里，依然正常运行之前的命令，让它在内部监听 8000：

python server_api.py

2.
第二步：
在你的 Windows 电脑上，重新打开一个全新的终端（CMD 或 PowerShell），输入以下带有 -L 参数的命令：

ssh -L 8000:127.0.0.1:8000 featurize@workspace.featurize.cn -p 30577
#ssh -L 8002:127.0.0.1:8001 featurize@workspace.featurize.cn -p 30577

3.第三步：修改 Windows 客户端代码并运行
既然隧道已经把 Ubuntu 的 8000 端口“拉”到了你自己的电脑上，你在代码里就不需要填什么复杂的云端域名了！

打开 Windows 上的 client_app.py，将 SERVER_URL 修改为极其简单的本地地址：

Python
# client_app.py
# 因为有了 SSH 隧道，访问本地的 8000 就等于访问云端的 8000！
SERVER_URL = "http://127.0.0.1:8000/analyze/"